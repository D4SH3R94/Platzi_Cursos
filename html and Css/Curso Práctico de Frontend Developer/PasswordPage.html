<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="YardSale.css">
    <title>Password Page</title>
</head>
<body>
    <div class="login_container">
        <div class="login_form">
            <img src="./Platzi Materials/logos/logo_yard_sale.svg" alt="logo_yard_sale" class="logo_img">
            <h1 class="title">Create a New Password</h1>
            <p class="subtitle">Enter a new password for your account</p>
            <form action="/" class="form">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" class="input input-password" placeholder="*********">
                <label for="new_password" class="label">Password</label>
                <input type="password" id="new_password" class="input input-password" placeholder="*********">
                <input type="submit" class="primary-button login-button" value="Confirm">
            </form>
        </div>
    </div>
</body>
</html>
