<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="EmailConfirmationPage.css">
    <title>Email Confirmation Page</title>
</head>
<body>
    <div class="login_container">
        <div class="login_form">
            <img src="./Platzi Materials/logos/logo_yard_sale.svg" alt="logo_yard_sale" class="logo_img">
            <h1 class="title">Email has been send!</h1>
            <p class="subtitle">Please check your inbox for instructions on how to reset the password</p>
            <div class="email-image">
                <img src="./Platzi Materials/icons/email.svg" alt="email">
            </div>
            <button class="primary-button login-button">Login</button>
            <p class="resend">
                <span>Didn`t receive the email?</span>
                <a href="/">Resend</a>
            </p>
        </div>
    </div>        
</body>
</html>
