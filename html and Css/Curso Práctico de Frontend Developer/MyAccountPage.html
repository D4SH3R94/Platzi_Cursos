<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="MyAccountPage.css">
    <title>My Account Page</title>
</head>
<body>
    <div class="login_container">
        <div class="login_form">
            <h1 class="title">My Account</h1>
            <form action="/" class="form">
                <label for="name" class="label">Name</label>
                <input type="text" id="name" class="input input-name" placeholder="John Doe">
                <label for="email" class="label">Email</label>
                <input type="email" id="email" class="input input-email" placeholder="john.doe@example.com">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" class="input input-password" placeholder="*********">
                <input type="submit" class="primary-button login-button" value="Save">
            </form>
        </div>
    </div>
</body>
</html>
