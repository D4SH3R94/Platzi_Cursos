<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="LoginViewPage.css">
    <title>Login View Page</title>
</head>
<body>
    <div class="login_container">
        <div class="login_form">
            <img src="./Platzi Materials/logos/logo_yard_sale.svg" alt="logo_yard_sale" class="logo_img">
            <form action="/" class="form">
                <label for="Email" class="label">Email Address</label>
                <input type="text" id="email" class="input input-email" placeholder="janedoe@gmail.com">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" class="input input-password" placeholder="*********">
                <button class="primary-button login-button">Login</button>
                <a href="/">Forgot the password</a>
            </form>
            <button class="secundary-button signUp-button">Sign up</button>
        </div>
    </div>
</body>
</html>
