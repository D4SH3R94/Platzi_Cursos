<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ProductDescriptions.css">
    <title>Product Description</title>
</head>
<body>
    <aside class="aside-big-container">
        <div class="aside-container-upper">
            <figure class="product-img">
                <img src="./Platzi Materials/picture/bici-first.png" alt="bici-product" class="bici">
                <img src="./Platzi Materials/icons/icon_close.png" alt="close-icon" class="close-icon">
            </figure>
        </div>
        <div class="aside-container-down">
            <div class="big-doc-container">
                <div class="doc-container">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="product-info">
                <p class="price-product">$ 120.00</p>
                <p class="name-product">Bike</p>
                <p class="description-product">With its practical position, this bike also fulfills a decorative function, add your hall or workspace.</p>
            </div>
            <div class="button-container">
                <button class="add-to-cart-button">
                    <img src="./Platzi Materials/icons/bt_add_to_cart.svg" alt="add-to-cart-icon" class="add-to-cart-icon">
                    Add to cart
                </button>
            </div>
    </aside>
    
</body>
</html>
